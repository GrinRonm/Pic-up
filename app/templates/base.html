<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pic-up — Универсальный файлообменник нового поколения{% endblock %}</title>
    <meta name="description" content="Бесплатный сервис для временного хранения и обмена любыми файлами (фото, видео, документы, архивы) с хранением в Telegram. Без регистрации и API-ключей.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="/assets/css/styles.css">
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Ambient Background Glows -->
    <div class="ambient-glow glow-top-left"></div>
    <div class="ambient-glow glow-top-right"></div>
    <div class="ambient-glow glow-bottom-center"></div>

    <!-- History Drawer Toggle Button -->
    <button class="history-fab" id="sidebar-toggle" title="История загрузок" aria-label="История">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span class="fab-label">История</span>
    </button>

    <!-- History Drawer (Glassmorphism) -->
    <aside class="history-drawer" id="sidebar" aria-hidden="true">
        <div class="drawer-header">
            <div class="drawer-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span>История загрузок</span>
            </div>
            <button class="drawer-close" id="close-sidebar" aria-label="Закрыть">&times;</button>
        </div>
        <div class="drawer-content" id="sidebar-content">
            <div class="drawer-loader">
                <div class="spinner-ring"></div>
                <span>Загрузка истории...</span>
            </div>
        </div>
    </aside>
    <div class="drawer-backdrop" id="drawer-backdrop"></div>

    <!-- Main Container -->
    <div class="app-wrapper">
        <!-- Floating Glass Header -->
        <header class="app-header">
            <div class="header-inner">
                <a href="/" class="brand-link">
                    <div class="brand-badge-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path>
                            <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path>
                            <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"></path>
                            <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"></path>
                        </svg>
                    </div>
                    <span class="brand-name">Pic-up</span>
                    <span class="brand-chip">2.0</span>
                </a>

                <nav class="nav-links">
                    <a href="/" class="nav-item {% if request.url.path == '/' %}active{% endif %}">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <span>Загрузить</span>
                    </a>
                    <a href="/api/docs" class="nav-item btn-api-pill {% if request.url.path == '/api/docs' %}active{% endif %}">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="16 18 22 12 16 6"></polyline>
                            <polyline points="8 6 2 12 8 18"></polyline>
                        </svg>
                        <span>API Документация</span>
                    </a>
                    <a href="/docs" target="_blank" class="nav-item nav-swagger-pill">
                        <span class="pulse-dot"></span>
                        <span>Swagger UI</span>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <line x1="10" y1="14" x2="21" y2="3"></line>
                        </svg>
                    </a>
                </nav>
            </div>
        </header>

        <!-- Main Body Content -->
        <main class="app-main">
            {% block content %}{% endblock %}
        </main>

        <!-- Modern Footer -->
        <footer class="app-footer">
            <div class="footer-inner">
                <div class="footer-left">
                    <span class="footer-logo">Pic-up</span>
                    <span class="footer-sep">•</span>
                    <span class="footer-copy">Хранилище файлов с шифрованным бэкендом Telegram</span>
                </div>
                <div class="footer-links">
                    <a href="/api/docs">REST API</a>
                    <a href="/docs" target="_blank">OpenAPI / Swagger</a>
                    <a href="/redoc" target="_blank">ReDoc</a>
                    <a href="https://github.com/GrinRonm/Pic-up" target="_blank" rel="noopener">GitHub</a>
                </div>
            </div>
        </footer>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts -->
    <script src="/assets/js/scripts.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
